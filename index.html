<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Meu Caixa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F1F4F2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Identidade: verde-nota profundo e âmbar de cédula. O Início gira em torno de um bloco escuro com a régua do mês; atalhos coloridos; barra flutuante. Abas: Início, Contas, Metas, Conversar; Ajustes pelo topo. Duas colunas em telas largas. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E7EDEA; --line:#DCE4E0;
  --fg:#0D1F1B; --muted:#586C65;
  --accent:#FFB92E; --accent-fg:#1C1300; --brand:#0B6B5C; --hero:#0E4D45;
  --in:#0B7F63; --in-bg:#D8F1E7;
  --out:#C23B2A; --out-bg:#FCE4DF;
  --warn:#8A5600; --warn-bg:#FFEFC4;
  --shadow:0 0 0 1px var(--line),0 12px 28px -14px rgba(13,31,27,.22);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--sx:#898781;--grid:#E1E8E4;--axis:#BAC6C0;
  --avb:92%; --avf:34%; --barl:50%;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,sans-serif;
  --r:22px;
  --hero-fg:#FFFFFF; --hero-mut:color-mix(in srgb,#fff 70%,var(--hero));
  --r1:#7DB4FF;--r2:#FF9CC2;--r3:#FFC85A;--r4:#B2A6FF;--r5:#43E0A0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1110; --surface:#111B19; --surface2:#182522; --line:#223330;
  --fg:#E6F0EC; --muted:#92A8A0;
  --accent:#FFC24D; --accent-fg:#1C1300; --brand:#58D3B5; --hero:#0F403A;
  --in:#4DCBA0; --in-bg:#103228;
  --out:#FF8C70; --out-bg:#3A1D15;
  --warn:#E8B04B; --warn-bg:#35280E;
  --avb:24%; --avf:80%; --barl:62%;
  --shadow:0 0 0 1px var(--line);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--sx:#898781;--grid:#1F2E2B;--axis:#374B46;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1110; --surface:#111B19; --surface2:#182522; --line:#223330;
  --fg:#E6F0EC; --muted:#92A8A0;
  --accent:#FFC24D; --accent-fg:#1C1300; --brand:#58D3B5; --hero:#0F403A;
  --in:#4DCBA0; --in-bg:#103228;
  --out:#FF8C70; --out-bg:#3A1D15;
  --warn:#E8B04B; --warn-bg:#35280E;
  --avb:24%; --avf:80%; --barl:62%;
  --shadow:0 0 0 1px var(--line);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--sx:#898781;--grid:#1F2E2B;--axis:#374B46;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:12}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* barra do topo */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:700 18px var(--font-display);letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font:400 11px var(--font-body);color:var(--muted);letter-spacing:0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.monthnav button{border:0;background:transparent;height:36px;min-width:36px;border-radius:99px;font-size:20px;line-height:1;color:var(--muted)}
.monthnav button:hover{background:var(--surface2)}
.monthnav .mlabel{font:600 14px var(--font-display);color:var(--fg);padding:0 6px;white-space:nowrap}
.page{max-width:760px;margin:0 auto;padding-top:6px}
.view{display:flex;flex-direction:column;gap:14px}
/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;padding:10px 4px;min-height:40px}
.alert{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.alert.bad{background:var(--out-bg);color:var(--out)}
.alert b{font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* linhas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 32px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:64px}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.av{--h:220;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:700 16px var(--font-display);
  background:hsl(var(--h) 45% var(--avb));color:hsl(var(--h) 55% var(--avf))}
.row .d{font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.row .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .val{font:600 15px var(--font-display);text-align:right;white-space:nowrap}
.row.in .val{color:var(--in)}
.row.done .d{color:var(--muted);text-decoration:line-through}
.row.done .val{opacity:.6}
.ck{width:30px;height:30px;border-radius:99px;border:2px solid var(--line);background:var(--bg);padding:0;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.ck svg{width:16px;height:16px}
.ck:hover{border-color:var(--in)}
.row.done .ck{background:var(--in);border-color:var(--in);color:#fff}
.chip{background:var(--surface2);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
.chip.late{background:var(--out-bg);color:var(--out)}
.chip.soon{background:var(--warn-bg);color:var(--warn)}
.gh{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 0}
.gh h2{font-size:15px;color:var(--muted);font-weight:600}
.gh .tot{font:600 14px var(--font-display);color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.empty{padding:20px 16px;color:var(--muted);font-size:14px;text-align:center}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;min-height:38px}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* gráficos */
.cat{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:12px}
.cat .av{width:34px;height:34px;border-radius:11px;font-size:14px}
.cat .n{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.cat .t{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:5px}
.cat .t i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 55% var(--barl))}
.cat .p{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px;height:132px}
.mcol{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;font-size:11px;text-align:center;color:var(--muted);border:0;background:none;padding:0}
.mcol .b{display:flex;gap:3px;align-items:flex-end;flex:1;justify-content:center}
.mcol .b i{display:block;width:42%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:3px}
.mcol .b .a{background:var(--in)} .mcol .b .z{background:var(--out)}
.mcol.cur{color:var(--fg);font-weight:600}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px}
/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;gap:4px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav button.t{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:500;min-height:48px}
.nav button.t svg{width:24px;height:24px}
.nav button.t[aria-current="page"]{color:var(--fg);font-weight:600;background:var(--surface2)}
.nav button.add{flex:0 0 auto;width:56px;height:56px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);margin-top:-18px}
.nav button.add svg{width:28px;height:28px}
.nav button.add:active{transform:scale(.95)}
.nav [data-v="inicio"]{order:1}.nav [data-v="contas"]{order:2}.nav button.add{order:3}.nav #tabchat{order:4}
.nav.nochat [data-v="contas"]{order:3}.nav.nochat button.add{order:2}
@media(min-width:900px){
  .nav{top:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:10px;border-top:0;border-right:1px solid var(--line);padding:96px 8px 16px}
  .nav button.add,.nav.nochat button.add{order:-1;margin:0 0 10px}
  .nav button.t{flex:0 0 auto;width:72px}
  body{padding-left:calc(112px + env(safe-area-inset-left,0px));padding-bottom:40px}
  .bar{margin-left:calc(-1*(112px + env(safe-area-inset-left,0px)));padding-left:calc(112px + env(safe-area-inset-left,0px))}
  .page,.bar-in{max-width:820px}
}
/* formulários e folhas */
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;width:100%}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;min-height:46px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{color:var(--out);border-color:transparent;background:var(--out-bg)}
.btn.block{width:100%}
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);align-self:center;flex:0 0 auto}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:24px;padding-top:20px}.grab{display:none}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h2{font-size:20px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lab{font-size:12px;color:var(--muted);font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;min-height:40px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.seg button.o[aria-pressed="true"]{color:var(--out)} .seg button.i[aria-pressed="true"]{color:var(--in)}
.money{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.money:focus-within{border-color:var(--brand)}
.money span{font:600 22px var(--font-display);color:var(--muted)}
.money input{border:0;background:transparent;font:700 38px var(--font-display);padding:0;min-height:52px;border-radius:0;letter-spacing:-.02em}
.money input:focus{outline:none}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cc{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:7px;font-size:13px;min-height:38px}
.cc .av{width:24px;height:24px;border-radius:8px;font-size:11px}
.cc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:600}
.dq{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:13px;color:var(--out);background:var(--out-bg);border-radius:10px;padding:8px 12px}
.foot{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px}
.opt:hover{background:var(--surface2)}
.opt b{font:600 16px var(--font-display)}
.opt small{color:var(--muted);font-size:12px;line-height:1.3}
.opt .av{width:36px;height:36px}
.dh{display:flex;gap:12px;align-items:center}
.dh .av{width:48px;height:48px;border-radius:15px;font-size:20px}
.dh .amt{font:700 28px var(--font-display);letter-spacing:-.02em}
.dh.in .amt{color:var(--in)}
.kv{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;z-index:40;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:4px 6px}
/* conversa */
.chat{display:flex;flex-direction:column;gap:12px;padding:12px}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:calc(100vh - 330px);overflow:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;overflow-wrap:anywhere;font-size:15px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.msg.a.th{color:var(--muted)}
.msg .reg{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.msg .li{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px}
.msg .li.in b{color:var(--in)} .msg .li.out b{color:var(--out)}
.msg .macts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0;border-radius:99px;padding-inline:18px}
.cform .btn{border-radius:99px}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px;font-size:13px;text-align:left}
.sug:hover{background:var(--surface2)}
.cbox{position:relative;margin-top:12px}
.cbox svg{display:block;max-width:100%;height:auto;overflow:visible;touch-action:pan-y}
.cbox svg text{font-family:var(--font-body)}
.tip{position:absolute;z-index:5;top:-6px;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.4;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.28);min-width:120px;max-width:230px}
.tip b{font-weight:600}
.tip .ev{display:flex;justify-content:space-between;gap:12px;opacity:.92}
.donut{display:flex;justify-content:center;margin:4px 0 10px}
.lgs{display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto 38px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 8px;border-radius:10px;text-align:left;font-size:13px;min-height:40px}
.lg:hover,.lg.on{background:var(--surface2)}
.lg i{width:10px;height:10px;border-radius:99px}
.lg .p{color:var(--muted);text-align:right;font-size:12px}
details.tv{margin-top:8px;font-size:12px;color:var(--muted)}
details.tv summary{cursor:pointer;padding:6px 0}
.tv table{width:100%;border-collapse:collapse}
.tv th,.tv td{padding:5px 0;text-align:right;font-weight:400}
.tv th:first-child,.tv td:first-child{text-align:left}
@media(max-width:560px){.two{grid-template-columns:1fr}.hbig{font-size:34px}.row{grid-template-columns:40px minmax(0,1fr) auto 30px;gap:10px;padding:12px}.brand small{max-width:140px}}
.pbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--in);transition:width .3s}
.pbar.warn i{background:var(--warn)}.pbar.bad i{background:var(--out)}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:64px}
.list .lrow:first-child{border-top:0}
.lrow .d{font-size:15px}.lrow .meta{font-size:12px;color:var(--muted)}
.inss{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ins{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.ins i{width:8px;height:8px;border-radius:50%;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dw{font-size:11px;color:var(--muted);text-align:center;font-weight:500}
.dd{aspect-ratio:1;min-height:40px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-weight:600;font-size:14px;color:var(--fg)}
.dd.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.dd[aria-pressed="true"]{background:var(--in);border-color:var(--in);color:var(--bg)}
.sq{position:relative}
.sq input{width:100%;padding-left:14px}
.nav.nochat::after{content:"";flex:1;max-width:120px;order:5}

function normCfg(d){const c=defCfg();if(!d||typeof d!=="object") return c;if(d.diaria>0)c.diaria=+d.diaria;if(d.reservaMensal>0)c.reservaMensal=+d.reservaMensal;if(isFinite(d.saldoInicial))c.saldoInicial=+d.saldoInicial;if(d.limites&&typeof d.limites==="object")for(const k in d.limites)if(d.limites[k]>0)c.limites[k]=+d.limites[k];if(typeof d.bk==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.bk))c.bk=d.bk;if(typeof d.nome==="string")c.nome=d.nome.slice(0,40);if(["auto","light","dark"].includes(d.tema))c.tema=d.tema;if(Object.keys({teal:1,blue:1,plum:1,graphite:1,wine:1}).includes(d.cor))c.cor=d.cor;else if(d.cor==="violet")c.cor="plum";else if(d.cor==="rose")c.cor="wine";if(Array.isArray(d.cats))c.cats=d.cats.filter(x=>x&&typeof x.n==="string"&&x.n.trim()&&x.n.length<=24&&(x.t==="saida"||x.t==="entrada")&&isFinite(x.h)).map(x=>({n:x.n.trim(),t:x.t,h:Math.round(+x.h)%360}));if(Array.isArray(d.metas))c.metas=d.metas.filter(m=>m&&m.id&&m.nome&&m.alvo>0).map(m=>({id:String(m.id),nome:String(m.nome),alvo:+m.alvo}));return c}

function parseBR(s){
  s=String(s||"").replace(/[^\d.,-]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");

/* Um lançamento vira uma ocorrência em cada mês em que vale. */
function occurrence(it,ym){
  if(it.rec==="unica"){
    if(!it.data||it.data.slice(0,7)!==ym) return null;
    return {it,day:+it.data.slice(8,10),key:"u",parc:null};
  }
  if(!it.inicio||ym<it.inicio) return null;
  const day=Math.min(it.dia||1,daysIn(ym));
  const ovv=it.ov&&it.ov[ym]>0?it.ov[ym]:0,itv=ovv?Object.assign({},it,{valor:ovv,ovm:true}):it;
  if(it.rec==="mensal"){
    if(it.fim&&ym>it.fim) return null;
    return {it:itv,day,key:ym,parc:null};
  }
  const n=diffMonths(it.inicio,ym)+1;
  if(n<1||n>it.parcelas) return null;
  return {it:itv,day,key:ym,parc:n+"/"+it.parcelas};
}
function monthOccs(ym){

}

function totals(ym){

}

}
async function initStore(){
  let timer=setTimeout(()=>{if(!loaded){loaded=true;items=localLoad()||[];setSync("Sem conexão; usando este aparelho");render()}},10000);
  try{
    const c=window.claude;

      ref.onSnapshot(snap=>{
        if(snap.metadata.hasPendingWrites) return;
        clearTimeout(timer);
        const d=snap.exists?snap.data():null;
        if(d&&Array.isArray(d.items)){items=d.items;cfg=normCfg(d.cfg)} else if(!loaded) items=localLoad()||[];
        loaded=true; setSync(snap.metadata.fromCache?"Carregando da nuvem…":"Tudo salvo"); render();

      return;
    }

}

const brl0=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const compact=new Intl.NumberFormat("pt-BR",{notation:"compact",maximumFractionDigits:1});
const axisFmt=v=>v===0?"0":(v<0?"−":"")+compact.format(Math.abs(v));
function niceTicks(min,max,n){
  const span=(max-min)||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag;
  const step=(nr<=1?1:nr<=2?2:nr<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,t=[];
  for(let v=lo;v<=hi+step/1e6;v+=step)t.push(Math.round(v*100)/100);
  return t;
}
function showTip(box,x,html){

}

/* Saldo acumulado dia a dia: mostra onde o dinheiro "some" */
function drawFlow(box,T,W){
  const days=daysIn(curYm),H=200,m={l:46,r:14,t:18,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const ev=Array.from({length:days+1},()=>[]);
  T.ins.concat(T.outs).forEach(o=>ev[Math.min(o.day,days)].push(o));
  const bal=[0];let run=0;
  for(let d=1;d<=days;d++){ev[d].forEach(o=>{run+=o.it.tipo==="entrada"?o.it.valor:-o.it.valor});bal[d]=Math.round(run*100)/100}
  const vals=bal.slice(1),final=bal[days];
  const ticks=niceTicks(Math.min(0,...vals),Math.max(0,...vals,1),3),lo=ticks[0],hi=ticks[ticks.length-1];
  const X=d=>m.l+(days>1?(d-1)/(days-1)*iw:0),Y=v=>m.t+ih*(1-(v-lo)/((hi-lo)||1));
  const pts=[[X(1),Y(0)]];let prev=0;
  for(let d=1;d<=days;d++){if(ev[d].length){pts.push([X(d),Y(prev)],[X(d),Y(bal[d])]);prev=bal[d]}}
  pts.push([X(days),Y(prev)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");
  const area=line+"L"+X(days).toFixed(1)+","+Y(0).toFixed(1)+"L"+X(1).toFixed(1)+","+Y(0).toFixed(1)+"Z";
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Saldo acumulado ao longo de '+monthName(curYm)+". Termina em "+brl.format(final)+'.">';
  ticks.forEach(t=>{s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var('+(t===0?"--axis":"--grid")+')" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" class="num">'+axisFmt(t)+"</text>"});
  const xt=[1,5,10,15,20,25];if(days-25>=4)xt.push(days);
  xt.forEach(d=>{s+='<text x="'+X(d)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="var(--muted)" class="num">'+d+"</text>"});
  s+='<path d="'+area+'" fill="var(--s1)" fill-opacity=".10"/><path d="'+line+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  if(curYm===todayYm){const tx=Math.max(14,Math.min(W-14,X(todayDay)));s+='<line x1="'+X(todayDay)+'" x2="'+X(todayDay)+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-width="1" stroke-opacity=".6"/><text x="'+tx+'" y="11" text-anchor="middle" font-size="10" fill="var(--muted)">hoje</text>'}
  const halo='paint-order="stroke" stroke="var(--surface)" stroke-width="4" stroke-linejoin="round"';
  let minD=1;for(let d=2;d<=days;d++)if(bal[d]<bal[minD])minD=d;
  if(bal[minD]<0&&bal[minD]<final-0.5){
    const right=X(minD)>W/2;
    s+='<circle cx="'+X(minD)+'" cy="'+Y(bal[minD])+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="'+(X(minD)+(right?-8:8))+'" y="'+(Y(bal[minD])+16)+'" text-anchor="'+(right?"end":"start")+'" font-size="11" font-weight="600" fill="var(--fg)" '+halo+' class="num">menor: '+brl.format(bal[minD])+" · dia "+minD+"</text>";
  }
  s+='<circle cx="'+X(days)+'" cy="'+Y(final)+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="'+(X(days)-8)+'" y="'+(Y(final)-9)+'" text-anchor="end" font-size="12" font-weight="600" fill="var(--fg)" '+halo+' class="num">'+brl.format(final)+"</text>";
  s+='<line class="xl" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><circle class="xd" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>';
  s+='<rect class="hit" x="'+m.l+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent"/></svg><div class="tip" hidden></div>';
  box.innerHTML=s;
  const svg=box.querySelector("svg"),xl=svg.querySelector(".xl"),xd=svg.querySelector(".xd");
  const move=e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width);
    const d=Math.max(1,Math.min(days,Math.round((px-m.l)/(iw||1)*(days-1))+1)),x=X(d);
    xl.setAttribute("x1",x);xl.setAttribute("x2",x);xl.setAttribute("visibility","visible");
    xd.setAttribute("cx",x);xd.setAttribute("cy",Y(bal[d]));xd.setAttribute("visibility","visible");
    const list=ev[d].slice(0,3).map(o=>'<div class="ev"><span>'+esc(o.it.desc)+'</span><span class="num">'+(o.it.tipo==="entrada"?"+":"−")+brl.format(o.it.valor)+"</span></div>").join("")+(ev[d].length>3?'<div class="ev"><span>+ '+(ev[d].length-3)+" outros</span></div>":"");
    showTip(box,x*(r.width/W),"<b>Dia "+d+"</b> · saldo <b class=\"num\">"+brl.format(bal[d])+"</b>"+list);
  };
  const out=()=>{hideTip(box);xl.setAttribute("visibility","hidden");xd.setAttribute("visibility","hidden")};
  const hit=svg.querySelector(".hit");

/* Rosca: para onde foi o dinheiro (cada categoria tem sempre a mesma cor) */
const CAT_SLOT={"Moradia":1,"Alimentação":2,"Mercado":3,"Transporte":4,"Contas da casa":5,"Cartão de crédito":6,"Lazer":7,"Saúde":8};
const catColor=c=>CAT_SLOT[c]?"var(--s"+CAT_SLOT[c]+")":"var(--sx)";
function drawDonut(box,T){
  const by={};T.outs.forEach(o=>{const c=o.it.cat||"Outros";by[c]=(by[c]||0)+o.it.valor});
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),total=T.tout;
  if(!rows.length){box.innerHTML='<div class="empty" style="padding:18px 0">Sem saídas neste mês.</div>';return}
  const S=184,r=70,sw=20,C=2*Math.PI*r,gap=rows.length>1?2.5:0;
  let cum=0,segs="";
  rows.forEach(([c,v],i)=>{
    const L=v/total*C,len=Math.max(0.5,L-gap);
    segs+='<circle class="seg" data-i="'+i+'" cx="'+S/2+'" cy="'+S/2+'" r="'+r+'" fill="none" stroke="'+catColor(c)+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+" "+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-(cum+gap/2)).toFixed(2)+'" transform="rotate(-90 '+S/2+" "+S/2+')" tabindex="0" role="img" aria-label="'+esc(c)+": "+brl.format(v)+'" style="transition:opacity .15s"/>';
    cum+=L;
  });
  const legend=rows.map(([c,v],i)=>'<button type="button" class="lg" data-i="'+i+'"><i style="background:'+catColor(c)+'"></i><span class="n">'+esc(c)+'</span><span class="v num">'+brl.format(v)+'</span><span class="p num">'+Math.round(v/total*100)+"%</span></button>").join("");
  box.innerHTML='<div class="donut"><svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+" "+S+'" style="overflow:visible">'+segs+
    '<text class="dl" x="'+S/2+'" y="'+(S/2-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">Saídas</text>'+
    '<text class="dv num" x="'+S/2+'" y="'+(S/2+13)+'" text-anchor="middle" font-size="20" font-weight="700" fill="var(--fg)" style="font-family:var(--font-display)">'+brl0.format(total)+"</text></svg></div>"+
    '<div class="lgs">'+legend+"</div>";
  const dl=box.querySelector(".dl"),dv=box.querySelector(".dv");
  const segEls=[...box.querySelectorAll(".seg")],lgEls=[...box.querySelectorAll(".lg")];
  const on=i=>{
    segEls.forEach((e,j)=>e.style.opacity=j===i?1:.3);lgEls.forEach((e,j)=>e.classList.toggle("on",j===i));
    dl.textContent=rows[i][0]+" · "+Math.round(rows[i][1]/total*100)+"%";dv.textContent=brl0.format(rows[i][1]);
  };
  const off=()=>{segEls.forEach(e=>e.style.opacity=1);lgEls.forEach(e=>e.classList.remove("on"));dl.textContent="Saídas";dv.textContent=brl0.format(total)};
  [...segEls,...lgEls].forEach(e=>{const i=+e.dataset.i;
    e.addEventListener("pointerenter",()=>on(i));e.addEventListener("focus",()=>on(i));e.addEventListener("click",()=>on(i));
    e.addEventListener("pointerleave",off);e.addEventListener("blur",off)});
}

/* Colunas: entradas x saídas dos últimos seis meses */
function drawMonths(box,W){
  const ms=[-5,-4,-3,-2,-1,0].map(n=>{const ym=addMonths(curYm,n),t=totals(ym);return{ym,a:t.tin,z:t.tout}});
  const H=180,m={l:40,r:4,t:10,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const ticks=niceTicks(0,Math.max(1,...ms.flatMap(x=>[x.a,x.z])),3),hi=ticks[ticks.length-1];
  const Y=v=>m.t+ih*(1-v/hi),slot=iw/6,bw=Math.min(16,(slot-14)/2);
  const col=(x,w,v,color)=>{
    if(v<=0) return "";
    const y=Y(v),h=Math.max(2,m.t+ih-y),yb=m.t+ih,rr=Math.min(4,h,w/2),yt=yb-h;
    return '<path d="M'+x+","+yb+" V"+(yt+rr)+" a"+rr+","+rr+" 0 0 1 "+rr+",-"+rr+" H"+(x+w-rr)+" a"+rr+","+rr+" 0 0 1 "+rr+","+rr+" V"+yb+' Z" fill="'+color+'"/>';
  };
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Entradas e saídas dos últimos seis meses">';
  ticks.forEach(t=>{s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var('+(t===0?"--axis":"--grid")+')" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" class="num">'+axisFmt(t)+"</text>"});
  ms.forEach((x,i)=>{
    const cx=m.l+slot*(i+.5),cur=x.ym===curYm;
    if(cur) s+='<rect x="'+(cx-slot/2+2)+'" y="'+(m.t-4)+'" width="'+(slot-4)+'" height="'+(ih+8)+'" rx="10" fill="var(--surface2)" opacity=".7"/>';
    s+=col(cx-1-bw,bw,x.a,"var(--s3)")+col(cx+1,bw,x.z,"var(--s2)");
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="'+(cur?"var(--fg)":"var(--muted)")+'" font-weight="'+(cur?600:400)+'">'+shortMonth(x.ym)+"</text>";
    s+='<rect class="mh" data-a="goto" data-ym="'+x.ym+'" data-i="'+i+'" x="'+(cx-slot/2)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent" tabindex="0" role="button" aria-label="'+monthName(x.ym)+": entradas "+brl.format(x.a)+", saídas "+brl.format(x.z)+'" style="cursor:pointer"/>';
  });
  s+='</svg><div class="tip" hidden></div>';
  box.innerHTML=s;
  box.querySelectorAll(".mh").forEach(e=>{
    const i=+e.dataset.i,x=ms[i],cx=m.l+slot*(i+.5);
    const show=()=>{const sc=box.querySelector("svg").getBoundingClientRect().width/W;showTip(box,cx*sc,"<b>"+cap(monthName(x.ym))+'</b><div class="ev"><span>Entradas</span><span class="num">'+brl.format(x.a)+'</span></div><div class="ev"><span>Saídas</span><span class="num">'+brl.format(x.z)+'</span></div><div class="ev"><span>Saldo</span><span class="num">'+brl.format(x.a-x.z)+"</span></div>")};
    e.addEventListener("pointerenter",show);e.addEventListener("focus",show);
    e.addEventListener("pointerleave",()=>hideTip(box));e.addEventListener("blur",()=>hideTip(box));
  });
  return ms;
}

/* ---------- Metas, limites, diárias e dicas ---------- */
const isRes=o=>o.it.cat==="Reserva";
const gastosOf=T=>T.outs.filter(o=>!isRes(o));
function spentBy(T,cat){return sum(T.outs.filter(o=>(o.it.cat||"Outros")===cat))}
function limitRows(T){
  return CATS_OUT.filter(c=>c!=="Reserva").map(c=>{const lim=cfg.limites[c]||0,g=spentBy(T,c);return{cat:c,lim,gasto:g,pct:lim?Math.round(g/lim*100):0}});
}
function reservaMes(ym){return sum(monthOccs(ym).filter(o=>isRes(o)&&o.paid))}
function reservaTotal(){
  if(!items.length) return 0;
  let min=todayYm;
  items.forEach(it=>{const y=it.rec==="unica"?(it.data||"").slice(0,7):it.inicio;if(y&&y<min)min=y});
  let t=0;const n=Math.min(120,diffMonths(min,todayYm));
  for(let i=0;i<=n;i++) t+=reservaMes(addMonths(min,i));
  return t;
}
/* Saldo real: tudo que já foi pago ou recebido até o mês atual, mais o ajuste feito pelo usuário */
function movimentoPago(){
  if(!items.length) return 0;
  let min=todayYm;
  items.forEach(it=>{const y=it.rec==="unica"?(it.data||"").slice(0,7):it.inicio;if(y&&y<min)min=y});
  let t=0;const n=Math.min(240,diffMonths(min,todayYm));
  for(let i=0;i<=n;i++)monthOccs(addMonths(min,i)).forEach(o=>{if(o.paid)t+=o.it.tipo==="entrada"?o.it.valor:-o.it.valor});
  return Math.round(t*100)/100;
}
const saldoAgora=()=>Math.round((movimentoPago()+cfg.saldoInicial)*100)/100;
function metaGuardado(id){return items.filter(it=>it.meta===id&&it.pago&&it.pago.u).reduce((s,it)=>s+it.valor,0)}

function diariaInfo(days,total){
  if(!(cfg.diaria>0)) return "";

    falta=obrig-fixo-total,n=Math.max(0,Math.ceil(falta/cfg.diaria-1e-9)),L=[];
  if(obrig>0){
    if(n===0) L.push('<div class="dl ok">Contas fixas e parcelas do mês já estão cobertas.</div>');
    else{
      const rest=curYm===todayYm?daysIn(curYm)-todayDay+(days.some(i=>i.data===todayStr)?0:1):(curYm>todayYm?daysIn(curYm):0);
      L.push('<div class="dl'+(n>rest?" bad":"")+'">Faltam <b>'+n+(n===1?" diária":" diárias")+'</b> para cobrir as contas do mês'+(n>rest?" (restam só "+Math.max(rest,0)+" dias)":"")+".</div>");

  }

}

/* Dicas: comparam o mês aberto com o anterior, até o mesmo dia */
function dayCut(ym){return ym===todayYm?todayDay:99}
function gastoCmp(ym,cut){
  const by={};let tot=0;
  monthOccs(ym).forEach(o=>{
    if(o.it.tipo!=="saida"||isRes(o)) return;
    if(o.it.rec==="unica"&&o.day>cut) return;
    const c=o.it.cat||"Outros";by[c]=(by[c]||0)+o.it.valor;tot+=o.it.valor;
  });
  return{by,tot};
}
function insightsHtml(T){
  const out=[],tone={n:"var(--muted)",w:"var(--warn)",b:"var(--out)",g:"var(--in)"};
  const add=(t,h)=>out.push('<div class="ins"><i style="background:'+tone[t]+'"></i><div>'+h+"</div></div>");
  if(curYm===todayYm){
    const day=n=>{const d=new Date(+todayYm.slice(0,4),+todayYm.slice(5,7)-1,todayDay-n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
    const w=(a,b)=>{let t=0;[addMonths(todayYm,-1),todayYm].forEach(ym=>monthOccs(ym).forEach(o=>{if(o.it.tipo!=="saida"||!o.paid)return;const k=ym+"-"+pad(o.day);if(k>=day(b)&&k<=day(a))t+=o.it.valor}));return t};
    const a=w(0,6),b=w(7,13);
    if(a>0||b>0) add(b===0||a<=b?"g":"w","<b>Últimos 7 dias:</b> você pagou "+brl.format(a)+(b>0?(a<=b?", "+brl.format(b-a)+" a menos":", "+brl.format(a-b)+" a mais")+" que nos 7 dias antes.":"."));
  }
  const G=gastosOf(T);
  if(T.tin>0&&G.length){
    const fx=sum(G.filter(o=>o.it.rec!=="unica")),p=Math.round(fx/T.tin*100);
    if(fx>0) add(p>=60?"b":p>=40?"w":"n","<b>"+p+"%</b> do que entra já está comprometido com contas fixas e parcelas ("+brl.format(fx)+").");
  }
  const cut=dayCut(curYm),prev=addMonths(curYm,-1),A=gastoCmp(curYm,cut),B=gastoCmp(prev,cut);
  if(B.tot>0&&A.tot>0){
    const d=A.tot-B.tot,mn=monthName(prev).split(" ")[0];
    add(d>0?"w":"g","Você gastou <b>"+brl.format(Math.abs(d))+(d>0?" a mais":" a menos")+"</b> do que em "+mn+(curYm===todayYm?", até o mesmo dia":"")+".");
    const ch=Object.keys(A.by).map(c=>({c,d:A.by[c]-(B.by[c]||0)})).filter(x=>x.d>20).sort((a,b)=>b.d-a.d)[0];
    if(ch) add("w","Maior alta: <b>"+esc(ch.c)+"</b>, "+brl.format(ch.d)+" a mais.");
  }
  const av=G.filter(o=>o.it.rec==="unica"),small=av.filter(o=>o.it.valor<=50);
  if(small.length>=3) add("n","<b>"+small.length+" gastos de até R$ 50</b> somaram "+brl.format(sum(small))+" ("+Math.round(sum(small)/sum(av)*100)+"% dos gastos avulsos).");
  if(curYm===todayYm&&av.length&&todayDay>=3){
    const so=sum(av.filter(o=>o.day<=todayDay)),avg=so/todayDay;
    if(so>0) add("n","Gastos avulsos: <b>"+brl.format(avg)+" por dia</b>. Neste ritmo, fecham o mês em cerca de "+brl.format(avg*daysIn(curYm))+".");
  }
  if(av.length){const m=av.slice().sort((a,b)=>b.it.valor-a.it.valor)[0];add("n","Maior gasto avulso: <b>"+esc(m.it.desc)+"</b>, "+brl.format(m.it.valor)+" no dia "+m.day+".")}
  if(!out.length) return "";
  return '<div class="card o7"><h3>Onde o dinheiro escapa</h3><div class="sub">Pistas tiradas dos seus lançamentos</div><div class="inss">'+out.join("")+"</div></div>";
}

function readSf(){if(!sf) return;const a=$("sv1"),n=$("sn");if(a)sf.v=a.value;if(n)sf.nome=n.value}
function sfFail(m){sf.err=m;renderSf()}
function saveSf(){
  readSf();const s=sf,val=parseBR(s.v);
  if(s.k==="ov"){const it=items.find(x=>x.id===s.id);if(!it) return closeModal();if(!(val>0)) return sfFail("Informe um valor maior que zero.");it.ov=it.ov||{};it.ov[s.key]=val;closeModal();persist();render();toast("Valor deste mês salvo");return}
  if(s.k==="reset"){const pi=items,pc=cfg;items=[];cfg=Object.assign(defCfg(),{nome:cfg.nome,tema:cfg.tema,cor:cfg.cor,cats:cfg.cats});closeModal();persist();render();toast("Tudo apagado","Desfazer",()=>{items=pi;cfg=pc;persist();render()});return}
  if(s.k==="res-meta"){
    if(s.v.trim()===""||val===0){cfg.reservaMensal=0}else if(!(val>0)) return sfFail("Informe um valor válido."); else cfg.reservaMensal=val;
    closeModal();persist();render();toast("Meta salva");
  }else if(s.k==="res-save"){
    if(!(val>0)) return sfFail("Informe quanto você guardou.");
    const meta=s.meta?cfg.metas.find(m=>m.id===s.meta):null,it={id:uid(),tipo:"saida",rec:"unica",desc:meta?meta.nome:"Reserva",valor:val,cat:"Reserva",data:todayStr,pago:{u:true}};
    if(meta) it.meta=meta.id;
    items.push(it);curYm=todayYm;closeModal();persist();render();toast(brl.format(val)+" guardados");
  }else if(s.k==="goal"){
    const nome=String(s.nome||"").trim();
    if(!nome) return sfFail("Dê um nome para a meta.");
    if(!(val>0)) return sfFail("Informe quanto quer juntar.");
    if(s.id){const m=cfg.metas.find(x=>x.id===s.id);if(m){m.nome=nome;m.alvo=val}}else cfg.metas.push({id:uid(),nome,alvo:val});
    closeModal();persist();render();toast("Meta salva");
  }else if(s.k==="cat"){
    const nome=String(s.nome||"").trim();
    if(!nome) return sfFail("Dê um nome para a categoria.");
    const all=BASE_OUT.concat(BASE_IN,cfg.cats.map(c=>c.n)).map(nrm);
    if(all.includes(nrm(nome))) return sfFail("Já existe uma categoria com esse nome.");
    cfg.cats.push({n:nome,t:s.t,h:s.h});applyCats();
    closeModal();persist();render();toast("Categoria criada");
  }else if(s.k==="saldo"){
    if(!isFinite(val)) return sfFail("Informe um valor válido.");
    cfg.saldoInicial=Math.round((val-movimentoPago())*100)/100;
    closeModal();persist();render();toast("Saldo ajustado para "+brl.format(val));
  }else if(s.k==="lim"){
    if(s.v.trim()===""||val===0) delete cfg.limites[s.cat];
    else if(!(val>0)) return sfFail("Informe um valor válido."); else cfg.limites[s.cat]=val;
    closeModal();persist();render();toast("Limite salvo");
  }

/* ---------- Interpretador local (sem IA, sem custo) ---------- */
const nrm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const KW_OUT=[
  ["Reserva",["reserva","guardei","separei","poupanca","investi","investimento","cofrinho"]],
  ["Moradia",["aluguel","condominio","iptu","reforma","financiamento da casa","financiamento do apartamento","mobilia"]],
  ["Contas da casa",["luz","energia","agua","internet","gas","telefone","wifi","conta de luz","conta de agua"]],
  ["Cartão de crédito",["cartao","fatura"]],
  ["Saúde",["farmacia","remedio","medico","consulta","dentista","plano de saude","exame","hospital","academia"]],
  ["Transporte",["uber","99","onibus","gasolina","combustivel","estacionamento","metro","passagem","pedagio","oficina","mecanico","ipva","bilhete","moto","carro"]],
  ["Alimentação",["almoco","jantar","lanche","cafe","restaurante","ifood","pizza","hamburguer","marmita","comida","sorvete","acai","padaria","salgado","pastel","refrigerante","bar"]],
  ["Mercado",["mercado","supermercado","feira","acougue","hortifruti","atacadao","atacarejo","compras"]],
  ["Lazer",["cinema","show","festa","jogo","netflix","spotify","streaming","viagem","balada","ingresso","passeio","presente"]],
  ["Dívidas",["divida","emprestimo","juros","multa","boleto atrasado"]]
];
const KW_IN=[["Diária",["diaria"]],["Salário",["salario","holerite","contracheque"]],["Freela",["freela","freelance","freelancer","projeto","cliente","job"]]];
const MESES=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS=["domingo","segunda","terca","quarta","quinta","sexta","sabado"];
const hasW=(t,w)=>new RegExp("(^|[^a-z0-9])"+w+"([^a-z0-9]|$)").test(t);
const isDiariaPhrase=n=>/(trabalhei|fui trabalhar|fiz a diaria|fiz diaria)/.test(n);
function splitClauses(t){
  const parts=t.split(/\s*(?:;|\n|\s+e\s+|,(?!\d))\s*/).map(s=>s.trim()).filter(Boolean),out=[];
  parts.forEach(p=>{
    if(out.length&&/^(todo|toda|todos|dia |no dia|ate |até|vence|sempre|por mes|por mês|mensal|em \d|\d+\s*x)/.test(nrm(p))) out[out.length-1]+=" "+p; else out.push(p);
  });
  const res=[];let carry="";
  out.forEach((p,ix)=>{const n=nrm(p);
    const dNext=isDiariaPhrase(n)&&!/\d/.test(n)&&out[ix+1]&&/^(diaria|valor)/.test(nrm(out[ix+1]));
    if((!/\d|\bmil\b/.test(n)&&!isDiariaPhrase(n))||dNext) carry+=(carry?" ":"")+p;
    else{res.push((carry?carry+" ":"")+p);carry=""}
  });
  if(carry){if(res.length) res[res.length-1]+=" "+carry; else res.push(carry)}
  return res;
}
const pad2=n=>String(n).padStart(2,"0");
const dStr=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
function dateFrom(n,pastish){
  const d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(/anteontem/.test(n)){d.setDate(d.getDate()-2);return dStr(d)}
  if(/\bontem\b/.test(n)){d.setDate(d.getDate()-1);return dStr(d)}
  let m=n.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(m){let y=m[3]?+m[3]:d.getFullYear();if(y<100)y+=2000;const dd=new Date(y,+m[2]-1,+m[1]);if(dd.getMonth()===+m[2]-1)return dStr(dd)}
  m=n.match(/\bdia (\d{1,2})\b/);
  if(m){const day=+m[1];if(day>=1&&day<=31){let mo=d.getMonth(),y=d.getFullYear();if(pastish&&day>todayDay){mo--;if(mo<0){mo=11;y--}}const dd=new Date(y,mo,Math.min(day,daysIn(y+"-"+pad2(mo+1))));return dStr(dd)}}
  m=n.match(/\b(segunda|terca|quarta|quinta|sexta|sabado|domingo)\b/);
  if(m){const w=DIAS.indexOf(m[1]);let back=(d.getDay()-w+7)%7;d.setDate(d.getDate()-back);return dStr(d)}
  return todayStr;
}
function findCat(n,tipo){
  for(const c of (cfg.cats||[]).filter(x=>x.t===tipo)){const k=nrm(c.n);if(k&&hasW(n,k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))) return c.n}
  for(const [c,ws] of (tipo==="entrada"?KW_IN:KW_OUT)) for(const w of ws) if(hasW(n,w)) return c;
  return "Outros";
}
const STOP=new Set("gastei paguei comprei recebi ganhei caiu entrou vendi tirei guardei separei vou vai pagar receber hoje ontem anteontem de do da dos das no na nos nas em um uma o a os as com para pra por meu minha foi deu mais ate todo toda todos dia mes mensal mensalmente x vezes parcelas parcela preciso tenho que falta vence vencimento reais real conto pila r trabalhei fui trabalhar fiz diaria ja acabei".split(" "));
function descFrom(orig,cat){
  let t=orig.toLowerCase().replace(/r\$/g," ").replace(/(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?)\s*(k|mil)?/g," ").replace(/\bmil\b/g," ")
    .replace(/\b(segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)(-feira)?\b/g," ").replace(/\bat[ée]\s+\p{L}+(\s+de\s+\d{4})?/gu," ");
  const w=t.split(/[^\p{L}]+/u).filter(x=>x&&!STOP.has(nrm(x))&&!MESES.includes(nrm(x)));
  const s=w.join(" ").trim();
  return s?(s.charAt(0).toUpperCase()+s.slice(1)).slice(0,40):cat;
}
function parseOne(clause,ctx){
  const orig=clause.trim(),n=nrm(orig);
  const q=/^(quanto|qual|quais|como|onde|saldo|resumo|sobrou|sobra)\b/.test(n)&&!/\d/.test(n);
  if(q) return {ask:true};
  const diaria=isDiariaPhrase(n);
  const ent=diaria||/\b(recebi|ganhei|caiu|entrou|vendi|receber|recebimento|me pagaram|salario|diaria|freela|freelance)\b/.test(n);
  const sai=/\b(gastei|paguei|comprei|pagar|tirei|guardei|separei)\b/.test(n);
  const tipo=ent&&!sai?"entrada":sai&&!ent?"saida":(ctx.tipo||(ent?"entrada":"saida"));
  // parcelas
  let work=n,parcelas=0,dividir=false;
  const mp=work.match(/(\d{1,3})\s*(?:x|vezes|parcelas?)\b/);
  if(mp){parcelas=+mp[1];dividir=/\bem\s*$/.test(work.slice(0,mp.index).trim()+" ")&&!/\bde\s*(r\$)?\s*\d/.test(work.slice(mp.index+mp[0].length,mp.index+mp[0].length+12));work=work.replace(mp[0]," ")}
  // datas e recorrência fora da busca do valor
  const mfim=work.match(/\bate\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s+de\s+(\d{4}))?/);
  work=work.replace(/\b(todo\s+)?dia\s+\d{1,2}\b/g," ").replace(/\d{1,2}\/\d{1,2}(?:\/\d{2,4})?/g," ").replace(/\bate\s+\p{L}+(\s+de\s+\d{4})?/gu," ").replace(/r\$/g," ");
  let valor=NaN;
  const mn=work.match(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(k|mil)?(?![a-z0-9])/);
  if(mn){valor=parseBR(mn[1]);if(mn[2]) valor=Math.round(valor*1000*100)/100}
  else if(/\bmil\b/.test(work)) valor=1000;
  const rec=parcelas>1?"parcelada":(mfim||/\b(todo mes|todos os meses|mensal|mensalmente|por mes|assinatura)\b|todo dia/.test(n)?"mensal":"unica");
  if(parcelas>1&&dividir&&valor>0) valor=Math.round(valor/parcelas*100)/100;
  const pastRe=/\b(gastei|paguei|comprei|recebi|ganhei|caiu|entrou|vendi|tirei|guardei|separei|trabalhei|fiz)\b/,futRe=/\b(vou|vai|preciso|tenho que|tenho de|falta|vence|vencimento|a pagar|a receber|previsto)\b/;
  const futuro=futRe.test(n)&&!pastRe.test(n);
  const data=dateFrom(n,pastRe.test(n));
  let cat=diaria?"Diária":findCat(n,tipo);
  const o={tipo,cat};
  if(diaria){
    o.diaria=true;o.desc="Diária";o.valor=valor>0?valor:cfg.diaria;o.rec="unica";o.data=data;o.pago=!futuro&&data<=todayStr;
    if(!(o.valor>0)) return {fail:"Quanto vale a sua diária? Diga o valor uma vez (por exemplo, “trabalhei hoje, diária de 150”) ou defina em Início > Marcar dias."};
    return {item:o,tipo};
  }
  if(!(valor>0)) return {fail:"Não achei o valor em “"+orig+"”. Escreva o valor, por exemplo: “gastei 35 no almoço”."};
  o.valor=valor;o.rec=rec;
  const meta=cat==="Reserva"?cfg.metas.find(m=>hasW(n,nrm(m.nome).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))):null;
  o.desc=meta?meta.nome:descFrom(orig,cat);if(meta)o.meta=meta.id;
  if(rec==="unica"){o.data=data;o.pago=!futuro&&data<=todayStr}
  else{
    const md=n.match(/\bdia (\d{1,2})\b/),dm=n.match(/(\d{1,2})\/\d{1,2}/);
    o.dia=md?+md[1]:(dm?+dm[1]:todayDay);o.inicio=todayYm;o.pago=false;
    if(rec==="parcelada") o.parcelas=parcelas;
    else if(mfim){let y=mfim[2]?+mfim[2]:today.getFullYear();const mi=MESES.indexOf(mfim[1]);if(!mfim[2]&&mi<today.getMonth())y++;o.fim=y+"-"+pad2(mi+1)}
  }
  return {item:o,tipo};
}
function answerQuestion(text){
  const n=nrm(text),T=totals(curYm),mes=monthName(curYm).split(" ")[0];
  const G=gastosOf(T),tot=sum(G),by={};G.forEach(o=>{const c=o.it.cat||"Outros";by[c]=(by[c]||0)+o.it.valor});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(/saldo|conta agora|tenho/.test(n)) return "Na conta agora: "+brl.format(saldoAgora())+". Sobra prevista em "+mes+": "+brl.format(T.tin-T.tout)+".";
  if(/onde|categoria|mais gastei|maior/.test(n)) return top.length?"Em "+mes+" o dinheiro foi mais para: "+top.map(([c,v])=>c+" "+brl.format(v)).join(", ")+".":"Ainda não há gastos em "+mes+".";
  if(/sobr|sobra/.test(n)) return "Sobra prevista em "+mes+": "+brl.format(T.tin-T.tout)+" (entradas "+brl.format(T.tin)+", saídas "+brl.format(T.tout)+").";
  return "Em "+mes+": entradas "+brl.format(T.tin)+", saídas "+brl.format(T.tout)+" ("+brl.format(T.tout-T.rout)+" ainda a pagar). Gastos sem reserva: "+brl.format(tot)+".";
}
function localParse(text){
  const clauses=splitClauses(text.trim());
  if(clauses.length===1&&/^(oi|ola|olá|bom dia|boa tarde|boa noite|ajuda|help)\b/.test(nrm(clauses[0]))&&!/\d/.test(clauses[0])) return {itens:[],reply:HELP};
  const itens=[],fails=[];let ctx={},asked=null;
  for(const c of clauses){
    const r=parseOne(c,ctx);
    if(r.ask){asked=c;continue}
    if(r.fail){fails.push(r.fail);continue}
    itens.push(r.item);ctx={tipo:r.tipo};
  }
  if(asked&&!itens.length) return {itens:[],reply:answerQuestion(asked)};
  if(!itens.length) return {itens:[],reply:fails[0]||HELP,fail:true};
  const nome=itens.length===1?itens[0].desc:itens.length+" lançamentos";
  const fut=itens.some(i=>i.pago===false);
  return {itens,reply:"Pronto! "+(itens.length===1?"Lancei “"+nome+"”":"Lancei "+nome)+(fut?" como em aberto.":".")+(fails.length?" Não consegui entender: "+fails.join(" "):"")};
}

function saveForm(){
  readForm();const f=form;
  const valor=parseBR(f.valor),fail=m=>{f.err=m;renderModal()};
  if(!(valor>0)) return fail("Informe um valor maior que zero.");
  if(!String(f.desc).trim()) f.desc=f.cat||"Outros";
  const it={id:f.id||uid(),tipo:f.tipo,rec:f.rec,desc:String(f.desc).trim(),valor,cat:f.cat,pago:f.pago||{}};
  if(f.rec==="unica"){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f.data)) return fail("Escolha a data.");
    it.data=f.data;
  }else{
    const dia=parseInt(f.dia,10);
    if(!(dia>=1&&dia<=31)) return fail("O dia do mês deve ficar entre 1 e 31.");
    if(!/^\d{4}-\d{2}$/.test(f.inicio)) return fail("Escolha o mês de início.");
    it.dia=dia;it.inicio=f.inicio;
    if(f.rec==="parcelada"){
      const n=parseInt(f.parcelas,10);
      if(!(n>=1&&n<=120)) return fail("Informe o número de parcelas (1 a 120).");
      it.parcelas=n;
    }else if(f.fim){
      if(f.fim<f.inicio) return fail("O fim não pode ser antes do início.");
      it.fim=f.fim;
    }
  }
  const i=items.findIndex(x=>x.id===it.id);
  if(i>=0) items[i]=it; else items.push(it);
  const first=it.rec==="unica"?it.data.slice(0,7):it.inicio;
  if(!occurrence(it,curYm)) curYm=first>curYm?first:(it.rec==="unica"?first:curYm);
  closeModal();persist();render();toast("Salvo");
}
function delItem(id){
  const i=items.findIndex(x=>x.id===id);if(i<0) return;
  const rm=items.splice(i,1)[0];
  closeModal();persist();render();
  toast("Lançamento excluído","Desfazer",()=>{items.splice(Math.min(i,items.length),0,rm);persist();render()});
}

function cleanItem(o){
  if(!o||typeof o!=="object") return null;
  const tipo=o.tipo==="entrada"?"entrada":o.tipo==="saida"?"saida":null;if(!tipo) return null;
  let valor=typeof o.valor==="number"?Math.round(o.valor*100)/100:parseBR(o.valor);

  if(!(valor>0)||valor>1e7) return null;
  const desc=String(o.desc||"").trim().slice(0,60);if(!desc) return null;
  const cat=(tipo==="entrada"?CATS_IN:CATS_OUT).includes(o.cat)?o.cat:"Outros";
  const rec=["unica","mensal","parcelada"].includes(o.rec)?o.rec:"unica";
  const it={id:uid(),tipo,rec,desc,valor,cat,pago:{}};
  if(rec==="unica"){
    it.data=/^\d{4}-\d{2}-\d{2}$/.test(o.data)?o.data:todayStr;
    if(o.pago!==false) it.pago.u=true;
  }else{
    const dia=parseInt(o.dia,10);
    it.dia=dia>=1&&dia<=31?dia:todayDay;
    it.inicio=/^\d{4}-\d{2}$/.test(o.inicio)?o.inicio:todayYm;
    if(rec==="parcelada"){const n=parseInt(o.parcelas,10);if(!(n>=1&&n<=120)) return null;it.parcelas=n}
    else if(/^\d{4}-\d{2}$/.test(o.fim)&&o.fim>=it.inicio) it.fim=o.fim;
    if(o.pago===true) it.pago[it.inicio]=true;
  }
  if(o.diaria===true&&tipo==="entrada"&&rec==="unica"){
    if(items.some(x=>x.diaria&&x.data===it.data)) return null;
    it.diaria=true;it.cat="Diária";it.desc="Diária";
  }
  if(o.meta&&cfg.metas.some(m=>m.id===o.meta)) it.meta=o.meta;
  return it;
}
function chatRules(){
  const T=totals(curYm),by={};
  T.outs.forEach(o=>{by[o.it.cat||"Outros"]=(by[o.it.cat||"Outros"]||0)+o.it.valor});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,v])=>c+" "+brl.format(v)).join(", ")||"nenhuma";
  const dow=today.toLocaleDateString("pt-BR",{weekday:"long"});
  return 'Você é o assistente do app "Meu Caixa", de finanças pessoais. A pessoa escreve mensagens curtas em português e você transforma em lançamentos. As respostas anteriores suas, nesta conversa, também são JSON.\n'+
  "Hoje é "+todayStr+" ("+dow+"). Mês aberto no app: "+curYm+".\n"+
  'Responda SOMENTE com um JSON: {"reply":"no máximo 2 frases amigáveis em português, dizendo o que registrou","itens":[ ... ]}\n'+
  'Cada item: {"tipo":"saida"|"entrada","desc":"curta, com inicial maiúscula","valor":número em reais com ponto decimal,"cat":"uma categoria da lista","rec":"unica"|"mensal"|"parcelada","data":"AAAA-MM-DD" (só unica),"dia":1 a 31 (só mensal/parcelada),"inicio":"AAAA-MM" (só mensal/parcelada),"fim":"AAAA-MM" (opcional, só mensal),"parcelas":número (só parcelada),"pago":true|false}\n'+
  "Categorias de saída: "+CATS_OUT.join(", ")+". Categorias de entrada: "+CATS_IN.join(", ")+".\n"+
  "Regras:\n"+
  '- "gastei", "paguei", "comprei" = saída com pago true. "recebi", "ganhei", "caiu", "entrou" = entrada com pago true.\n'+
  '- "vou pagar", "vence", "tenho que pagar" = saída com pago false. "vou receber" = entrada com pago false.\n'+
  '- Sem data, use hoje. Resolva "ontem", "anteontem", "dia 5" (no mês atual) para uma data completa.\n'+
  "- Mais de um gasto ou ganho na mesma mensagem = vários itens.\n"+
  '- "todo mês", "mensal", "assinatura" = rec mensal, com inicio no mês atual, salvo se a pessoa disser outro. Conta fixa não paga ainda tem pago false.\n'+
  '- "10x de 220" = rec parcelada, parcelas 10, valor 220 (valor de CADA parcela), pago false. Se só vier o total ("1000 em 10x"), divida. inicio no mês atual e dia de hoje, salvo se a pessoa disser outro.\n'+
  '- Valores: "35 reais", "35,50", "R$ 1.200", "1k" e "mil" valem 35, 35.5, 1200, 1000 e 1000.\n'+
  '- Se faltar o valor, devolva "itens":[] e pergunte no reply. Se for uma pergunta (ex: quanto gastei?), responda no reply com os números do resumo abaixo e devolva "itens":[].\n'+
  '- "trabalhei hoje", "fui trabalhar", "fiz a diária" = UMA entrada com "diaria":true, cat Diária, rec unica, pago true. '+(cfg.diaria>0?"Valor da diária cadastrada: "+cfg.diaria+" (use esse valor se a pessoa não disser outro).":"A diária ainda não foi cadastrada: se a pessoa não disser o valor, itens vazio e pergunte quanto vale a diária.")+"\n"+
  '- "guardei 100", "separei 200 para reserva" = saída com cat Reserva, pago true.\n'+
  "- Nunca invente lançamentos que a pessoa não pediu.\n"+
  "Resumo de "+monthName(curYm)+": entradas "+brl.format(T.tin)+" (recebido "+brl.format(T.rin)+"); saídas "+brl.format(T.tout)+" (pago "+brl.format(T.rout)+"); falta pagar "+brl.format(T.tout-T.rout)+"; maiores categorias de saída: "+top+".";
}
const CHAT_ERR={
  not_granted:"Você não autorizou o Claude nesta página. Dá para cadastrar pelo botão Novo ou pelo lançamento rápido.",
  rate_limited:"Muitos pedidos seguidos. Espere um pouco e tente de novo.",
  session_expired:"Sua sessão expirou. Entre de novo no Claude e reabra esta página.",
  invalid_json:"Não entendi essa mensagem. Tente de outro jeito, por exemplo: “gastei 35 no almoço”.",
  empty_completion:"Não entendi essa mensagem. Tente de outro jeito, por exemplo: “gastei 35 no almoço”.",
  refused:"Não consegui registrar essa mensagem. Tente de outro jeito."
};
function liHtml(it){
  const isIn=it.tipo==="entrada";
  const when=it.rec==="unica"?it.data.slice(8,10)+"/"+it.data.slice(5,7):it.rec==="mensal"?"todo dia "+it.dia:it.parcelas+"× no dia "+it.dia;
  return '<div class="li '+(isIn?"in":"out")+'"><span>'+esc(it.desc)+' · '+when+'</span><b class="num">'+(isIn?"+":"−")+" "+brl.format(it.valor)+"</b></div>";
}
function renderChat(){
  const box=$("msgs");if(!box) return;
  if(!chat.length){
    box.innerHTML='<div class="msg a">Oi! Me conte o que entrou ou saiu e eu lanço no seu caixa. Funciona sem IA e sem gastar créditos. Pode falar de mais de um gasto na mesma mensagem.</div>'+
      '<div class="sugs">'+SUGS.map(s=>'<button type="button" class="sug" data-a="sug" data-t="'+esc(s)+'">'+esc(s)+"</button>").join("")+"</div>";
    return;
  }
  box.innerHTML=chat.map((m,i)=>{
    if(m.r==="u") return '<div class="msg u">'+esc(m.t)+"</div>";
    let h='<div class="msg a'+(m.th?" th":"")+'">'+esc(m.t);
    if(m.its&&m.its.length&&!m.undone){
      h+='<div class="reg">'+m.its.map(liHtml).join("")+'</div><div class="macts"><button class="btn sm" data-a="see" data-mi="'+i+'">Ver no caixa</button><button class="btn sm" data-a="undo" data-mi="'+i+'">Desfazer</button></div>';
    }else if(m.undone) h+='<div class="hint" style="margin-top:6px">Desfeito.</div>';
    if(m.ai) h+='<div class="macts"><button class="btn sm" data-a="ai-retry" data-mi="'+i+'">Tentar com a IA do Claude</button></div><div class="hint" style="margin-top:4px">A IA usa os créditos da sua conta Claude.</div>';
    return h+"</div>";
  }).join("");
  box.scrollTop=box.scrollHeight;
}
function undoChat(i){
  const m=chat[i];if(!m||!m.its||m.undone) return;
  const ids=new Set(m.its.map(x=>x.id));
  items=items.filter(x=>!ids.has(x.id));m.undone=true;
  persist();render();renderChat();toast("Lançamentos desfeitos");
}
function seeChat(i){
  const m=chat[i];if(!m||!m.its||!m.its.length) return;
  const f=m.its[0];curYm=f.rec==="unica"?f.data.slice(0,7):f.inicio;
  filter="tudo";setView("contas");
}
function sendChat(text){
  text=text.trim();if(!text) return;
  chat.push({r:"u",t:text});
  const r=localParse(text),m={r:"a",t:r.reply,its:[],th:false};
  const its=(r.itens||[]).slice(0,12).map(cleanItem).filter(Boolean);
  if(its.length){const dd=its.find(x=>x.diaria);if(dd&&!(cfg.diaria>0))cfg.diaria=dd.valor;items=items.concat(its);persist();render();m.its=its}
  if(r.fail&&sampleFn) m.ai=text;
  chat.push(m);renderChat();
}
async function aiChat(i){
  const m=chat[i];if(!m||!m.ai||pending||!sampleFn) return;
  const text=m.ai;m.ai=null;pending=true;m.t="Pensando com a IA…";m.th=true;renderChat();
  try{
    const input=[{role:"user",content:chatRules()},{role:"user",content:text}];
    const res=await sampleFn.json(input,{modelTier:"quick",cache:false});
    const its=(Array.isArray(res&&res.itens)?res.itens:[]).slice(0,12).map(cleanItem).filter(Boolean);
    if(its.length){items=items.concat(its);persist();render()}
    m.t=typeof (res&&res.reply)==="string"&&res.reply.trim()?res.reply.trim():(its.length?"Registrado.":"Não encontrei nada para registrar.");m.its=its;
  }catch(e){m.t=CHAT_ERR[e&&e.code]||"Não consegui agora. Tente de novo."}
  finally{m.th=false;pending=false;renderChat()}
}
$("cform").addEventListener("submit",e=>{
  e.preventDefault();
  const v=$("cin").value;if(!v.trim()) return;
  $("cin").value="";sendChat(v);$("cin").focus({preventScroll:true});
});
(async()=>{
  try{
    const s=window.claude&&await window.claude.use("sample");
    if(s&&typeof s.json==="function"){sampleFn=s}
  }catch(e){}
  try{const d=window.claude&&await window.claude.use("downloads");if(d&&typeof d.save==="function"){dlApi=d;if(view==="metas")render()}}catch(e){}
})();
(function(){let x0=0,y0=0,ok=false;
  document.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;ok=e.touches.length===1&&!e.target.closest("svg,.cbox,input,textarea,select,.sheet,.scrim,.msgs,.seg,.chips,[role=slider]")},{passive:true});
  document.addEventListener("touchend",e=>{if(!ok||$("modal").innerHTML||view==="chat"||view==="ajustes")return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>90&&Math.abs(dy)<45){const b=$(dx<0?"next":"prev");if(b)b.click()}},{passive:true});
})();
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==="inicio")render()},150)});
initStore();
})();
</script>
